<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your next design | Elunette</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/adaptive.css') }}"></head><body class="adaptive-page"><main class="adaptive-shell"><a href="{{ url_for('client_dashboard') }}">← The Elunette Studio</a><p class="eyebrow">A thoughtful beginning</p><h1>Tell us what you’re imagining.</h1><p>Choose your service and designer. Save your ideas as you go.</p><form method="post" class="adaptive-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="META01">{{ catalog.meta_fields[0].label }} · Required</label><input id="META01" name="META01" maxlength="150" required><label for="META02">{{ catalog.meta_fields[1].label }} · Required</label><select id="META02" name="META02" required><option value="">Choose a service</option>{% for service in services %}<option value="{{ service.value }}">{{ service.label }}</option>{% endfor %}</select><label for="provider_id">Your service provider · Required</label><select id="provider_id" name="provider_id" required><option value="">Choose your designer</option>{% for provider in providers %}<option value="{{ provider.id }}">{{ provider.full_name }}</option>{% endfor %}</select><button type="submit">Begin your brief</button>{% if not providers %}<p>No service providers are currently available.</p>{% endif %}</form></main></body></html>
