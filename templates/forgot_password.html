
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Elunette</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <!-- HEADER -->

    <header class="auth-header">

        <a href="/" class="logo" aria-label="Elunette Home">
            <img
                src="{{ url_for('static', filename='images/elunette-logo.png') }}"
                alt="Elunette"
                class="logo-img">
        </a>

        <a href="/" class="back-home">
            Back to Home
        </a>

    </header>


    <!-- MAIN CONTENT -->

    <main class="auth-main">

        <section class="auth-container"
                 aria-labelledby="forgot-title">

            <!-- INTRODUCTION -->

            <div class="auth-intro">

                <p class="section-label">
                    ACCOUNT RECOVERY
                </p>

                <h1 id="forgot-title">
                    Let's get you back on track.
                </h1>

                <p class="auth-description">
                    Forgotten your password? No worries.
                    Enter your registered email address,
                    and we'll send you a link to reset it.
                </p>

            </div>


            <!-- PASSWORD RESET REQUEST FORM -->

            <div class="auth-form-container">

                <form
                    action="/forgot-password"
                    method="POST"
                    class="auth-form">

<!-- CSRF PROTECTION -->

<input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}">

                    <!-- EMAIL ADDRESS -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            maxlength="254"
                            required>

                    </div>


                    <!-- SUBMIT BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary auth-submit">

                        Send Reset Link

                    </button>

                </form>


                <!-- BACK TO LOGIN -->

                <p class="auth-switch">
                    Remembered your password?
                    <a href="/login">Back to Log In</a>
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="auth-footer">

        <p>
            &copy; 2026 Elunette. All rights reserved.
        </p>

    </footer>

</body>

</html>
