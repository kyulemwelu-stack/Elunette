
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Elunette</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <!-- HEADER -->

    <header class="auth-header">

        <a href="/" class="logo" aria-label="Elunette Home">
            <img
                src="{{ url_for('static', filename='images/elunette-logo.png') }}"
                alt="Elunette"
                class="logo-img">
        </a>

        <a href="/" class="back-home">
            Back to Home
        </a>

    </header>


    <!-- MAIN CONTENT -->

    <main class="auth-main">

        <section class="auth-container"
                 aria-labelledby="reset-title">

            <!-- INTRODUCTION -->

            <div class="auth-intro">

                <p class="section-label">
                    ACCOUNT SECURITY
                </p>

                <h1 id="reset-title">
                    A fresh start.
                </h1>

                <p class="auth-description">
                    Create a new password to securely
                    access your Elunette account.
                </p>

            </div>


            <!-- RESET PASSWORD FORM -->

            <div class="auth-form-container">

                <form method="POST" class="auth-form">

                    <!-- NEW PASSWORD -->

                    <div class="form-group">

                        <label for="new-password">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="new-password"
                            name="new_password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            minlength="12"
                            required>

                        <small class="form-hint">
                            Use at least 12 characters.
                        </small>

                    </div>


                    <!-- CONFIRM NEW PASSWORD -->

                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm_password"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            minlength="12"
                            required>

                    </div>


                    <!-- SUBMIT BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary auth-submit">

                        Reset Password

                    </button>

                </form>


                <!-- BACK TO LOGIN -->

                <p class="auth-switch">
                    Remember your password?
                    <a href="/login">Back to Log In</a>
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="auth-footer">

        <p>
            &copy; 2026 Elunette. All rights reserved.
        </p>

    </footer>

</body>

</html>
