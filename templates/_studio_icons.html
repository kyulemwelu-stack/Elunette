{% macro icon(name, class_name='') -%}
<svg class="studio-icon {{ class_name }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    {% if name == 'overview' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
    {% elif name == 'brief' %}<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>
    {% elif name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
    {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
    {% elif name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
    {% elif name == 'logout' %}<path d="M9 4H5v16h4M9 12h12m-4-4 4 4-4 4"/>
    {% elif name == 'check' %}<path d="m6 12 4 4 8-9"/><circle cx="12" cy="12" r="10"/>
    {% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    {% elif name == 'revision' %}<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6M12 7v5l3 2"/>
    {% elif name == 'home' %}<path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/>
    {% elif name == 'chevron' %}<path d="m7 10 5 5 5-5"/>
    {% endif %}
</svg>
{%- endmacro %}
